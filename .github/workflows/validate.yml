name: Validate client release tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check release boundaries
        run: python -m unittest discover -s tests -v
      - name: Validate Python and signing adapter
        run: |
          python -m py_compile scripts/light_client_release.py
          node --check packaging/sign-app.mjs
      - name: Check source, docs, and history for sensitive data
        run: python scripts/check_repository.py --history
      - name: Validate published cask syntax when present
        run: |
          if [ -f Casks/hermes-light.rb ]; then ruby -c Casks/hermes-light.rb; fi
