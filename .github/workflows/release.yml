name: Release Hermes Light

on:
  push:
    branches: [main]
    paths: [packaging/source.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-light-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate trusted packaging sources
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py --history
      - name: Check approved pin and recover a matching checkpoint
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release.py prepare
      - name: Require release secrets before spending runner time on a build
        if: steps.state.outputs.published != 'true'
        env:
          CONFIGURED: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' && secrets.MACOS_SIGNING_P12_PASSWORD != '' && secrets.APPLE_NOTARY_APPLE_ID != '' && secrets.APPLE_NOTARY_TEAM_ID != '' && secrets.APPLE_NOTARY_PASSWORD != '' }}
        run: |
          if [ "$CONFIGURED" != true ]; then
            echo 'Configure the release environment secrets manually using docs/RELEASING.md, then rerun this workflow.'
            exit 1
          fi
      - name: Build unsigned Light client without signing credentials
        if: steps.state.outputs.published != 'true' && steps.state.outputs.candidate != 'true'
        run: python scripts/light_client_release.py build
      - name: Import signing credentials into a temporary Keychain
        id: signing
        if: steps.state.outputs.published != 'true'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: python scripts/ci_release.py signing-setup
      - name: Sign and record the Apple submission
        if: steps.state.outputs.published != 'true' && steps.state.outputs.final != 'true'
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          WORK: ${{ steps.state.outputs.work }}
        run: |
          python scripts/light_client_release.py notarize --submit-only --profile hermes-light-ci --keychain "$KEYCHAIN" --identity "$IDENTITY"
          python scripts/light_client_release.py checkpoint --checkpoint-dir "$WORK/checkpoint-signed"
      - name: Save submission before waiting for Apple
        if: steps.state.outputs.published != 'true' && steps.state.outputs.final != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-checkpoint-${{ steps.state.outputs.tag }}-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.state.outputs.work }}/checkpoint-signed
          retention-days: 7
          if-no-files-found: error
      - name: Wait, staple, and verify Gatekeeper
        if: steps.state.outputs.published != 'true' && steps.state.outputs.final != 'true'
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: python scripts/light_client_release.py notarize --profile hermes-light-ci --keychain "$KEYCHAIN"
      - name: Preserve exact accepted release bytes for publication retries
        if: steps.state.outputs.published != 'true'
        env:
          WORK: ${{ steps.state.outputs.work }}
        run: python scripts/light_client_release.py checkpoint --checkpoint-dir "$WORK/checkpoint-final"
      - name: Save accepted release checkpoint
        if: steps.state.outputs.published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-checkpoint-${{ steps.state.outputs.tag }}-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.state.outputs.work }}/checkpoint-final
          retention-days: 7
          if-no-files-found: error
      - name: Verify draft assets and publish immutable release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ github.sha }}
        run: python scripts/light_client_release.py publish --target-commit "$TARGET_COMMIT"
      - name: Test the published archive through Homebrew
        run: python scripts/ci_release.py smoke
      - name: Commit the cask without rolling back a newer pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release.py commit-cask
      - name: Delete successful checkpoints and write summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release.py finish
      - name: Always delete the signing Keychain and files
        if: always()
        run: python scripts/ci_release.py signing-cleanup
      - name: Always uninstall test app and clear its download
        if: always()
        run: python scripts/ci_release.py smoke-cleanup
      - name: Always clear temporary build files
        if: always()
        run: python scripts/ci_release.py clean
